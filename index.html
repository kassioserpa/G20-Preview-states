    <style>
        :root { 
            --primary: #00e5ff; 
            --primary-glow: rgba(0, 229, 255, 0.4);
            --success: #00ffa3; 
            --danger: #ff3366; 
            --warning: #ff9d00;
            --bg-dark: #030712; 
            --overlay-bg: rgba(3, 7, 18, 0.85); 
        }
        body { 
            margin: 0; background: var(--bg-dark); overflow: hidden; 
            font-family: 'Inter', sans-serif; color: white; -webkit-user-select: none; user-select: none; 
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Ultra Glassmorphism */
        .glass-overlay {
            background: var(--overlay-bg);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .data-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .data-card::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            transition: left 0.5s ease;
        }
        .data-card:hover::before { left: 100%; }
        .data-card:hover { 
            border-color: var(--primary-glow); 
            background: rgba(0, 229, 255, 0.02); 
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
        }
        
        .dimension-label {
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.3em;
            color: rgba(255,255,255,0.5); font-weight: 800; margin-bottom: 0.5rem; display: block;
        }
        .impact-badge {
            font-size: 0.55rem; font-weight: 900; padding: 3px 8px; border-radius: 4px;
            text-transform: uppercase; margin-top: 10px; display: inline-block; letter-spacing: 0.1em;
        }
        .progress-bar-bg { background: rgba(255,255,255,0.05); border-radius: 999px; height: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        #system-boot {
            position: absolute; inset: 0; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .tab-btn { 
            transition: all 0.3s ease; border-bottom: 2px solid transparent; opacity: 0.5; 
        }
        .tab-btn.active { color: var(--primary); border-color: var(--primary); opacity: 1; text-shadow: 0 0 10px var(--primary-glow); }
        
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 50;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; opacity: 0.3;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .spin-duration-2500 {
            animation-duration: 2.5s !important;
        }
        .rotate-svg {
            transform: rotate(-90deg);
        }
        .debt-gauge-transition {
            transition: stroke-dasharray 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.0018); // Névoa volumétrica

            // Ângulo cinemático
            camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 1, 2000);
            camera.position.set(0, -180, 240);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableRotate = true; 
            controls.enablePan = false; 
            controls.enableZoom = true;
            controls.maxPolarAngle = Math.PI / 1.5;
            controls.minDistance = 100;
            controls.maxDistance = 500;
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            raycaster = new THREE.Raycaster(); mouse = new THREE.Vector2();

            // Grelha Holográfica
            const gridGeo = new THREE.GridHelper(2000, 100, 0x00e5ff, 0x00e5ff);
            gridGeo.rotation.x = Math.PI/2; 
            gridGeo.position.z = -2;
            gridGeo.material.opacity = 0.08; 
            gridGeo.material.transparent = true;
            scene.add(gridGeo);

            // Estrelas de Fundo Animadas
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<4000; i++) starPos.push((Math.random()-0.5)*3000, (Math.random()-0.5)*3000, (Math.random()-0.5)*2000 - 500);
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x00e5ff, size: 1.2, transparent: true, opacity: 0.4, sizeAttenuation: true }));
            scene.add(stars);

            scene.add(mapGroup);

            // Construção do Mapa Avançado - Todos os Países
            fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
                .then(r => r.json()).then(geo => {
                    geo.features.forEach(feat => {
                        const isG20 = Object.values(G20_INTEL).some(v => v.iso3 === feat.id);
                        
                        // Materiais
                        const matSolid = new THREE.MeshStandardMaterial({ 
                            color: isG20 ? 0x0a1120 : 0x020408, // Fundo ultra escuro para não-G20 
                            transparent: true, opacity: isG20 ? 0.9 : 0.4,
                            emissive: isG20 ? 0x002244 : 0x000000, 
                            roughness: 0.2, metalness: 0.8
                        });

                        const coords = feat.geometry.type === "Polygon" ? [feat.geometry.coordinates[0]] : feat.geometry.coordinates.map(p => p[0]);
                        coords.forEach(c => {
                            const shape = new THREE.Shape();
                            c.forEach((pt, i) => { 
                                const x = (pt[0]/180)*150, y = (pt[1]/90)*75; // Escala
                                if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y);
                            });
                            
                            const depth = isG20 ? 4 : 0.5;
                            const geom = new THREE.ExtrudeGeometry(shape, {depth: depth, bevelEnabled: false});
                            const mesh = new THREE.Mesh(geom, matSolid);
                            mapGroup.add(mesh);

                            // Bordas de Território para TODOS os países para formar continentes
                            const edges = new THREE.EdgesGeometry(geom);
                            const lineMat = new THREE.LineBasicMaterial({ 
                                color: isG20 ? 0x00e5ff : 0x1e293b, // Cyan Neon vs Cinza Subtil
                                transparent: true, 
                                opacity: isG20 ? 0.4 : 0.15 
                            });
                            const line = new THREE.LineSegments(edges, lineMat);
                            mapGroup.add(line);
                        });
                    });
                });

            // Iluminação Dinâmica
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            const light1 = new THREE.PointLight(0x00e5ff, 2, 800);
            light1.position.set(0, -50, 200);
            scene.add(light1);
            const light2 = new THREE.PointLight(0x00ffa3, 1, 800);
            light2.position.set(100, 100, 100);
            scene.add(light2);
            
            window.addEventListener('pointerdown', onMapClick);
            window.addEventListener('mousemove', onMouseMove);
            animate();
        }

        async function initNexus() {
            init3D();
            populateCountryList();
            const bootProg = document.getElementById('boot-progress');
            if (bootProg) bootProg.style.width = "100%";
            
            try {
                const raw = await fetch('https://restcountries.com/v3.1/all?fields=cca2,cca3,latlng').then(r => r.json());
                const loader = new THREE.TextureLoader();
                
                Object.keys(G20_INTEL).forEach(id => {
                    let lat, lon;
                    if (id === 'eu') { lat = 50.8; lon = 4.3; } // Bruxelas
                    else {
                        const country = raw.find(c => c.cca2.toLowerCase() === id);
                        if(country) { lat = country.latlng[0]; lon = country.latlng[1]; }
                    }

                    if (lat !== undefined) {
                        loader.load(`https://flagcdn.com/w160/${id}.png`, (tex) => {
                            const group = new THREE.Group();
                            
                            // Imagem da Bandeira
                            const flagMesh = new THREE.Mesh(
                                new THREE.CircleGeometry(4.5, 32), 
                                new THREE.MeshBasicMaterial({ map: tex })
                            );
                            
                            // Anel de Borda Fixo
                            const borderRing = new THREE.Mesh(
                                new THREE.RingGeometry(4.8, 5.5, 32), 
                                new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.8 })
                            );

                            // Anel Animado (Pulse)
                            const pulseRing = new THREE.Mesh(
                                new THREE.RingGeometry(5.8, 6.2, 32), 
                                new THREE.MeshBasicMaterial({ color: 0x00ffa3, transparent: true, opacity: 0.5 })
                            );
                            
                            group.add(flagMesh); group.add(borderRing); group.add(pulseRing);
                            group.position.set((lon/180)*150, (lat/90)*75, 8);
                            group.userData = { id, ...G20_INTEL[id], lat, lon };
                            
                            flagNodes.push(group);
                            animatedRings.push(pulseRing);
                            scene.add(group);

                            // Luz pontual em cada node estratégico
                            const nodeLight = new THREE.PointLight(0x00e5ff, 0.5, 30);
                            nodeLight.position.copy(group.position);
                            nodeLight.position.z += 5;
                            scene.add(nodeLight);
                        });
                    }
                });
            } catch (e) {
                console.warn("API de geolocalização offline. Flags via seletor de países disponíveis.");
                // Mostrar aviso discreto
                const warn = document.createElement('div');
                warn.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(255,157,0,0.15);border:1px solid rgba(255,157,0,0.3);color:#ff9d00;font-size:10px;font-family:monospace;padding:8px 16px;border-radius:8px;z-index:25;text-transform:uppercase;letter-spacing:0.1em;pointer-events:none;';
                warn.textContent = '⚠ Mapa sem coordenadas — use o seletor de países';
                document.body.appendChild(warn);
                setTimeout(() => warn.remove(), 5000);
            }

            setTimeout(() => { 
                document.getElementById('system-boot').style.opacity = '0';
                setTimeout(() => document.getElementById('system-boot').style.display = 'none', 800);
            }, 2500);
        }

        function onMouseMove(e) {
            mouse.x = (e.clientX/window.innerWidth)*2-1;

        function onMapClick(e) {

            const hits = raycaster.intersectObjects(flagNodes, true);

                while(node.parent && !node.userData.id) node = node.parent;
                showDashboard(node.userData);
            }
        }

        // Função de desenho de gráficos (Sparklines curvilíneas)
        function drawLineChart(canvasId, color, isVolatile = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0, 0, w, h);
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const points = [];
            const segments = 15;
            const step = w / segments;
            
            // Gerar pontos (mais variância se for inflação/volátil)
            for(let i = 0; i <= segments; i++) {
                const variance = isVolatile ? (Math.random() - 0.5) * h * 0.7 : (Math.random() - 0.5) * h * 0.3;
                points.push({ x: i * step, y: (h / 2) + variance });
            }
            
            // Desenhar curvas suaves (Quadratic Bézier)
            ctx.moveTo(points[0].x, points[0].y);
            for(let i = 1; i < points.length - 1; i++) {
                const xc = (points[i].x + points[i+1].x) / 2;
                const yc = (points[i].y + points[i+1].y) / 2;
                ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
            }
            ctx.lineTo(points[points.length-1].x, points[points.length-1].y);
            ctx.stroke();
        }

                drawLineChart('growth-chart', '#00ffa3', false);
                drawLineChart('inflation-chart', '#ff9d00', true);
            }, 50);

            switchTab(1);

            // Movimento de câmara tático (apenas se lat/lon disponíveis)
            if (data.lat !== undefined && data.lon !== undefined) {
                const x = (data.lon/180)*150; const y = (data.lat/90)*75;
                const st = camera.position.clone(), target = new THREE.Vector3(x, y - 20, 90), start = performance.now();
                function step(time) {
                    const t = Math.min((time-start)/1500, 1), e = 1-Math.pow(1-t, 4);
                    camera.position.lerpVectors(st, target, e);
                    controls.target.lerp(new THREE.Vector3(x, y, 0), e);
                    controls.update();
                    if(t<1) requestAnimationFrame(step);
                }
                requestAnimationFrame(step);
            }
        }

                    makeCard("Política & Fiscal", d.dim_politics.status, d.dim_politics.indicator, d.dim_politics.impact, d.dim_politics.level, "primary") +
                    makeCard("Jurídico & Regulatório", d.dim_juridical.status, d.dim_juridical.indicator, d.dim_juridical.impact, d.dim_juridical.level, "warning") +
                    `<div class="data-card bg-cyan-900/10 border-cyan-500/20"><span class="dimension-label !text-cyan-400">Assessment Institucional</span><p class="text-xs leading-relaxed text-gray-300 mt-2">Nível de risco calculado em ${100 - ((d.dim_politics.level + d.dim_juridical.level)/2)}%. Foco em monitoramento de estabilidade legislativa e reformas de base em curso.</p></div>`;
            } else if (idx === 2) {
                cont.innerHTML = 
                    makeCard("Situação Económica", d.dim_economy.status, d.dim_economy.indicator, d.dim_economy.impact, d.dim_economy.level, "success") +
                    makeCard("Mercado Consumidor", d.dim_market.status, d.dim_market.indicator, d.dim_market.impact, d.dim_market.level, "primary") +
                    `<div class="data-card"><span class="dimension-label">Vetor de Crescimento</span><p class="text-3xl font-black text-white mt-2">${((d.dim_economy.level + d.dim_market.level)/2).toFixed(0)}/100</p><p class="text-[10px] text-gray-500 mt-2 uppercase">Índice de Atração de Capital Privado</p></div>`;
            } else {
                cont.innerHTML = 
                    makeCard("Infraestrutura & Logística", d.dim_infra.status, d.dim_infra.indicator, d.dim_infra.impact, d.dim_infra.level, "primary") +
                    makeCard("Riscos Externos", d.dim_external.status, d.dim_external.indicator, d.dim_external.impact, d.dim_external.level, "danger") +
                    `<div class="data-card"><span class="dimension-label">Posição Global</span><p class="text-lg font-bold text-white mt-2">Integração Cadeias Valor</p><p class="text-[11px] text-gray-400 mt-2">Exposição cambial vs força exportadora atualizada para cenário Q1 2026.</p></div>`;
            }
        }

        function resetView() {
            const dash = document.getElementById('full-dashboard');
            dash.classList.remove('active', 'opacity-100');
            setTimeout(() => { dash.style.display = 'none'; dash.classList.add('hidden'); }, 700);
            
            // Retorno Orbital Cinematográfico
            const st = camera.position.clone(), target = new THREE.Vector3(0, -180, 240), start = performance.now();
            function step(time) {
                const t = Math.min((time-start)/1500, 1), e = 1-Math.pow(1-t, 4);
                camera.position.lerpVectors(st, target, e);
                controls.target.lerp(new THREE.Vector3(0, 0, 0), e);
                controls.update();
                if(t<1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        const clock = new THREE.Clock();
        function animate() { 
            requestAnimationFrame(animate); 
            const time = clock.getElapsedTime();
            
            // Pulsar anéis dos países
            animatedRings.forEach(ring => {
                const scale = 1 + Math.sin(time * 3) * 0.15;
                ring.scale.set(scale, scale, 1);
                ring.material.opacity = 0.5 - (Math.sin(time * 3) * 0.2);
            });

            // Rotação suave da cena para dar dinamismo quando não focado num país
            if (!document.getElementById('full-dashboard').classList.contains('opacity-100')) {
                scene.rotation.z = Math.sin(time * 0.1) * 0.02;
            }

            controls.update(); 
            renderer.render(scene, camera); 
        }

        // Listener dinâmico para garantir responsividade no motor 3D ao rodar dispositivos
        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Tecla ESC para fechar o dashboard
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const dash = document.getElementById('full-dashboard');
                if (dash && dash.classList.contains('opacity-100')) resetView();
            }
        });

        function toggleCountryList() {
            const panel = document.getElementById('country-panel');
            if (!panel) return;
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
            } else {
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        }

        function populateCountryList() {
            const panel = document.getElementById('country-panel');
            if (!panel) return;
            const sorted = Object.entries(G20_INTEL).sort(([,a],[,b]) => a.name.localeCompare(b.name));
            panel.innerHTML = sorted.map(([id, d]) => `
                <button onclick="selectCountryById('${id}')"
                    class="flex items-center gap-2 px-2 py-1.5 rounded-lg text-left hover:bg-cyan-500/10 transition-all group w-full border border-transparent hover:border-cyan-500/20">
                    <img src="https://flagcdn.com/w40/${id}.png" class="w-6 h-4 object-cover rounded-sm flex-shrink-0" alt="" onerror="this.style.display='none'">
                    <span class="text-[9px] font-mono text-gray-400 group-hover:text-cyan-400 transition-colors truncate">${d.name}</span>
                </button>
            `).join('');
        }

        function selectCountryById(id) {
            const d = G20_INTEL[id];
            if (!d) return;
            // Fechar o painel
            const panel = document.getElementById('country-panel');
            if (panel) { panel.classList.add('hidden'); panel.classList.remove('flex'); }
            showDashboard({ id, ...d });
        }

        window.onload = initNexus;
    </script>
</body>
</html>
